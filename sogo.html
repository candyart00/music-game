<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>산도깨비 소고 연주 평가</title>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<style>
    body {
        font-family: 'Malgun Gothic', sans-serif;
        text-align: center;
        background-color: #f0f8ff;
        margin: 0;
        padding: 20px;
    }
    h1 { color: #333; }
    .level-buttons { margin-bottom: 20px; }
    .level-btn {
        font-size: 1.2rem; padding: 10px 20px; margin: 5px;
        cursor: pointer; background-color: #ffd700;
        border: 2px solid #daa520; border-radius: 10px; font-weight: bold;
    }
    .level-btn:hover { background-color: #ffc107; }
    .game-section {
        display: none; background: white; padding: 30px;
        border-radius: 15px; box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        max-width: 600px; margin: 0 auto;
    }
    .active { display: block; }
    
    /* 1단계 스타일 */
    .instrument-container {
        display: flex; justify-content: center; gap: 20px; margin-top: 20px;
    }
    .instrument-card {
        font-size: 5rem; cursor: pointer; padding: 20px;
        border: 3px solid #ccc; border-radius: 15px; transition: transform 0.2s;
        display: flex; align-items: center; justify-content: center;
        width: 120px; height: 120px;
        background-color: #fafafa;
        overflow: hidden;
    }
    .instrument-card:hover { transform: scale(1.1); border-color: #4CAF50; }
    
    .sogo-img {
        width: 90px; height: 90px; object-fit: contain; display: block;
    }

    /* 2단계 스타일 */
    .symbol-box {
        display: inline-block; width: 60px; height: 60px;
        border: 3px dashed #888; border-radius: 10px; margin: 10px;
        font-size: 2.5rem; line-height: 60px; vertical-align: middle;
    }
    .symbol-btn {
        font-size: 2.5rem; margin: 10px; cursor: pointer;
        background: none; border: none;
    }
    .blue-circle { color: blue; }
    .red-cross { color: red; }

    /* 3단계 스타일 */
    .option-btn {
        font-size: 1.5rem; padding: 15px 30px; margin: 10px;
        cursor: pointer; background-color: #4CAF50; color: white;
        border: none; border-radius: 10px;
    }
    
    /* 공통 및 음성 버튼 스타일 */
    .feedback {
        font-size: 1.5rem; font-weight: bold; color: #1e90ff;
        margin-top: 20px; min-height: 35px;
    }
    .reset-btn {
        margin-top: 20px; padding: 10px 20px; font-size: 1rem;
        cursor: pointer; background-color: #f44336; color: white;
        border: none; border-radius: 5px;
    }
    .speak-btn {
        background: none; border: none; font-size: 1.5rem; cursor: pointer; vertical-align: middle; margin-left: 10px;
    }
    .speak-btn:hover { transform: scale(1.2); }
</style>
</head>
<body>

<h1>🥁 산도깨비 소고 연주 평가</h1>

<div class="level-buttons">
    <button class="level-btn" onclick="showLevel('step1')">1단계</button>
    <button class="level-btn" onclick="showLevel('step2')">2단계</button>
    <button class="level-btn" onclick="showLevel('step3')">3단계</button>
</div>

<!-- 1단계 게임 영역 -->
<div id="step1-level" class="game-section">
    <h2>그림을 보고 같은 악기를 찾아 클릭하세요. <button class="speak-btn" onclick="speakText('그림을 보고 같은 악기를 찾아 클릭하세요.')">🔊</button></h2>
    <div style="font-size: 3rem; display: flex; align-items: center; justify-content: center; gap: 10px;">
        보기: <img src="sogo.png" alt="소고" class="sogo-img"> (소고)
    </div>
    <div class="instrument-container">
        <div class="instrument-card" onclick="checkStep1('피아노', 'piano')">🎹</div>
        <div class="instrument-card" onclick="checkStep1('소고', 'sogo')">
            <img src="sogo.png" alt="소고" class="sogo-img">
        </div>
        <div class="instrument-card" onclick="checkStep1('기타', 'guitar')">🎸</div>
    </div>
    <div id="step1-feedback" class="feedback"></div>
</div>

<!-- 2단계 게임 영역 -->
<div id="step2-level" class="game-section">
    <h2>글자를 보고 맞는 기호를 클릭하여 완성하세요. <button class="speak-btn" onclick="speakText('글자를 보고 맞는 기호를 클릭하여 완성하세요.')">🔊</button></h2>
    <h1 style="letter-spacing: 15px;">쿵 쿵 딱</h1>
    <div>
        <div class="symbol-box" id="box1"></div>
        <div class="symbol-box" id="box2"></div>
        <div class="symbol-box" id="box3"></div>
    </div>
    <div style="margin-top: 20px;">
        <button class="symbol-btn blue-circle" onclick="addSymbol('〇', '쿵')">〇 (쿵)</button>
        <button class="symbol-btn red-cross" onclick="addSymbol('X', '딱')">X (딱)</button>
    </div>
    <div id="step2-feedback" class="feedback"></div>
    <button class="reset-btn" onclick="resetStep2()">다시 하기</button>
</div>

<!-- 3단계 게임 영역 -->
<div id="step3-level" class="game-section">
    <h2>거북이가 보여주는 기호에 맞는 구음을 찾으세요. <button class="speak-btn" onclick="speakText('거북이가 보여주는 기호에 맞는 구음을 찾으세요.')">🔊</button></h2>
    <div style="font-size: 3rem; margin-bottom: 20px;">
        🐢 거북이: 〇 〇 X
    </div>
    <div>
        <button class="option-btn" onclick="checkStep3('딱 쿵 딱')">딱 쿵 딱</button>
        <button class="option-btn" onclick="checkStep3('쿵 쿵 딱')">쿵 쿵 딱</button>
        <button class="option-btn" onclick="checkStep3('쿵 딱 쿵')">쿵 딱 쿵</button>
    </div>
    <div id="step3-feedback" class="feedback"></div>
</div>

<script>
    const fanfareAudio = new Audio('https://assets.mixkit.co/active_storage/sfx/2013/2013-preview.mp3');

    // 텍스트를 음성으로 읽어주는 함수
    function speakText(text) {
        window.speechSynthesis.cancel(); 
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'ko-KR';
        utterance.rate = 1.1; 
        window.speechSynthesis.speak(utterance);
    }

    function playSuccessAction() {
        confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
        fanfareAudio.currentTime = 0;
        fanfareAudio.play();
        speakText("정답입니다! 멋져요!");
    }

    function showLevel(level) {
        document.querySelectorAll('.game-section').forEach(section => {
            section.classList.remove('active');
        });
        document.getElementById(level + '-level').classList.add('active');
        
        document.getElementById('step1-feedback').innerText = '';
        document.getElementById('step3-feedback').innerText = '';
        resetStep2();
    }

    function checkStep1(soundText, instrument) {
        speakText(soundText);
        const feedback = document.getElementById('step1-feedback');
        
        setTimeout(() => {
            if (instrument === 'sogo') {
                feedback.innerText = '정답입니다! 멋져요! 🎉';
                playSuccessAction();
            } else {
                feedback.innerText = '아쉬워요. 소고를 다시 찾아보세요.';
            }
        }, 800);
    }

    let step2Answers = [];
    function addSymbol(symbol, soundText) {
        speakText(soundText);
        if (step2Answers.length < 3) {
            step2Answers.push(symbol);
            updateBoxes();
        }
        if (step2Answers.length === 3) {
            setTimeout(checkStep2, 600);
        }
    }

    function updateBoxes() {
        for (let i = 1; i <= 3; i++) {
            const box = document.getElementById('box' + i);
            if (step2Answers[i-1]) {
                box.innerText = step2Answers[i-1];
                box.className = 'symbol-box ' + (step2Answers[i-1] === '〇' ? 'blue-circle' : 'red-cross');
            } else {
                box.innerText = '';
                box.className = 'symbol-box';
            }
        }
    }

    function checkStep2() {
        const feedback = document.getElementById('step2-feedback');
        if (step2Answers.join('') === '〇〇X') {
            feedback.innerText = '정답입니다! 완벽해요! 🎉';
            playSuccessAction();
        } else {
            feedback.innerText = '다시 한 번 확인해 보세요.';
        }
    }

    function resetStep2() {
        step2Answers = [];
        updateBoxes();
        document.getElementById('step2-feedback').innerText = '';
    }

    function checkStep3(answer) {
        speakText(answer);
        const feedback = document.getElementById('step3-feedback');
        
        setTimeout(() => {
            if (answer === '쿵 쿵 딱') {
                feedback.innerText = '정답입니다! 멋져요! 🐢🎉';
                playSuccessAction();
            } else {
                feedback.innerText = '다시 한 번 거북이의 기호를 읽어보세요.';
            }
        }, 1200);
    }

    showLevel('step1');
</script>

</body>
</html>
