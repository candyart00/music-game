<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>모두가 꽃이야 - 음악 리듬 게임 1단계</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Jua', sans-serif;
            background-color: #87CEEB; /* 하늘색 배경 */
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #333;
        }

        /* 배경 애니메이션 요소 (꽃과 나비) */
        .background-elements {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* 나비 애니메이션 */
        .butterfly {
            position: absolute;
            top: 20%;
            left: -100px;
            width: 60px;
            animation: fly 15s linear infinite;
        }
        .butterfly2 {
            top: 40%;
            animation: fly 20s linear infinite 5s;
            transform: scale(0.8);
        }

        @keyframes fly {
            0% { transform: translateX(-100px) translateY(0) rotate(10deg); }
            25% { transform: translateX(25vw) translateY(-50px) rotate(-10deg); }
            50% { transform: translateX(50vw) translateY(20px) rotate(10deg); }
            75% { transform: translateX(75vw) translateY(-30px) rotate(-10deg); }
            100% { transform: translateX(110vw) translateY(0) rotate(10deg); }
        }

        /* 바닥 잔디 */
        .grass {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 120px;
            background: linear-gradient(to bottom, #7CFC00, #32CD32);
            border-top-left-radius: 50% 20px;
            border-top-right-radius: 50% 20px;
        }

        /* 흔들리는 꽃 */
        .flower {
            position: absolute;
            bottom: 30px;
            width: 50px;
            transform-origin: bottom center;
            animation: sway 3s ease-in-out infinite alternate;
        }
        .flower:nth-child(1) { left: 10%; animation-delay: 0s; }
        .flower:nth-child(2) { left: 85%; animation-delay: 1s; }
        .flower:nth-child(3) { left: 20%; animation-delay: 0.5s; transform: scale(0.8); }
        .flower:nth-child(4) { left: 75%; animation-delay: 1.5s; transform: scale(1.2); }

        @keyframes sway {
            0% { transform: rotate(-15deg); }
            100% { transform: rotate(15deg); }
        }

        /* 게임 보드 */
        #game-board {
            position: relative;
            width: 480px;
            height: 80vh;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            z-index: 10;
            display: none;
            flex-direction: column;
            overflow: hidden;
            border: 4px solid #FF69B4;
        }

        /* 시작 화면 UI */
        #start-screen {
            position: relative;
            width: 480px;
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            z-index: 20;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            border: 4px solid #FFB6C1;
        }

        h1 {
            color: #FF1493;
            margin-bottom: 20px;
            font-size: 32px;
        }
        
        p {
            margin-bottom: 20px;
            font-size: 18px;
            color: #555;
            line-height: 1.5;
        }

        .btn {
            border: 2px solid #FF69B4;
            color: white;
            background-color: #FF69B4;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 20px;
            font-weight: bold;
            font-family: 'Jua', sans-serif;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn:hover {
            background-color: #FF1493;
            transform: scale(1.05);
        }

        /* 게임 내부 요소 */
        .tracks {
            display: flex;
            flex: 1;
            position: relative;
        }

        .track {
            flex: 1;
            border-right: 1px dashed #FFC0CB;
            position: relative;
        }
        .track:last-child {
            border-right: none;
        }

        .key-label {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            color: #FF1493;
            z-index: 5;
        }

        /* 판정선 */
        .hit-line {
            position: absolute;
            bottom: 80px; /* 판정 위치 */
            width: 100%;
            height: 10px;
            background-color: rgba(255, 105, 180, 0.5);
            box-shadow: 0 0 10px #FF69B4;
            z-index: 2;
        }

        /* 떨어지는 타일 */
        .tile {
            position: absolute;
            width: 80%;
            height: 40px;
            left: 10%;
            background: linear-gradient(to bottom, #FFB6C1, #FF69B4);
            border-radius: 20px;
            box-shadow: 0 5px 10px rgba(0,0,0,0.2);
            z-index: 3;
        }

        /* UI 정보 (점수 등) */
        .top-ui {
            display: flex;
            justify-content: space-between;
            padding: 15px 20px;
            background: #FFF0F5;
            border-bottom: 2px solid #FFC0CB;
            font-size: 24px;
            font-weight: bold;
            color: #FF1493;
        }

        /* 피드백 효과 (최고예요!) */
        #feedback {
            position: absolute;
            top: 40%;
            width: 100%;
            text-align: center;
            font-size: 40px;
            font-weight: bold;
            color: #FFD700;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.3);
            opacity: 0;
            z-index: 15;
            transition: opacity 0.2s;
            pointer-events: none;
        }

        /* 키 누를 때 빛나는 효과 */
        .track.active {
            background: linear-gradient(to top, rgba(255, 105, 180, 0.3), transparent);
        }

    </style>
</head>
<body>

    <!-- 배경 장식 (CSS + SVG) -->
    <div class="background-elements">
        <!-- 나비 1 -->
        <svg class="butterfly" viewBox="0 0 100 100">
            <path d="M50 50 C 20 20, 0 40, 20 60 C 40 80, 50 50, 50 50 Z" fill="#FFB6C1" />
            <path d="M50 50 C 80 20, 100 40, 80 60 C 60 80, 50 50, 50 50 Z" fill="#FF69B4" />
            <circle cx="50" cy="50" r="5" fill="#333" />
        </svg>
        <!-- 나비 2 -->
        <svg class="butterfly butterfly2" viewBox="0 0 100 100">
            <path d="M50 50 C 20 20, 0 40, 20 60 C 40 80, 50 50, 50 50 Z" fill="#FFE4E1" />
            <path d="M50 50 C 80 20, 100 40, 80 60 C 60 80, 50 50, 50 50 Z" fill="#FFC0CB" />
            <circle cx="50" cy="50" r="5" fill="#333" />
        </svg>

        <div class="grass"></div>

        <!-- 꽃들 -->
        <svg class="flower" viewBox="0 0 100 120">
            <rect x="47" y="50" width="6" height="70" fill="#228B22" />
            <circle cx="50" cy="30" r="20" fill="#FFA500" />
            <circle cx="30" cy="15" r="15" fill="#FFF" />
            <circle cx="70" cy="15" r="15" fill="#FFF" />
            <circle cx="20" cy="40" r="15" fill="#FFF" />
            <circle cx="80" cy="40" r="15" fill="#FFF" />
            <circle cx="50" cy="60" r="15" fill="#FFF" />
        </svg>
        <svg class="flower" viewBox="0 0 100 120">
            <rect x="47" y="50" width="6" height="70" fill="#228B22" />
            <circle cx="50" cy="30" r="20" fill="#FF69B4" />
            <circle cx="30" cy="15" r="15" fill="#FFC0CB" />
            <circle cx="70" cy="15" r="15" fill="#FFC0CB" />
            <circle cx="20" cy="40" r="15" fill="#FFC0CB" />
            <circle cx="80" cy="40" r="15" fill="#FFC0CB" />
            <circle cx="50" cy="60" r="15" fill="#FFC0CB" />
        </svg>
        <svg class="flower" viewBox="0 0 100 120">
            <rect x="47" y="50" width="6" height="70" fill="#228B22" />
            <circle cx="50" cy="30" r="20" fill="#FFFF00" />
            <circle cx="30" cy="15" r="15" fill="#FFF" />
            <circle cx="70" cy="15" r="15" fill="#FFF" />
            <circle cx="20" cy="40" r="15" fill="#FFF" />
            <circle cx="80" cy="40" r="15" fill="#FFF" />
            <circle cx="50" cy="60" r="15" fill="#FFF" />
        </svg>
        <svg class="flower" viewBox="0 0 100 120">
            <rect x="47" y="50" width="6" height="70" fill="#228B22" />
            <circle cx="50" cy="30" r="20" fill="#FF4500" />
            <circle cx="30" cy="15" r="15" fill="#FFA07A" />
            <circle cx="70" cy="15" r="15" fill="#FFA07A" />
            <circle cx="20" cy="40" r="15" fill="#FFA07A" />
            <circle cx="80" cy="40" r="15" fill="#FFA07A" />
            <circle cx="50" cy="60" r="15" fill="#FFA07A" />
        </svg>
    </div>

    <!-- 시작 화면 -->
    <div id="start-screen">
        <h1>모두가 꽃이야</h1>
        <p>1단계: 한 마디(2박)에 하나씩 타일이 떨어집니다.<br>박자에 맞춰 <strong>D, F, J, K</strong> 키를 눌러주세요!</p>
        
        <div id="loading-msg" style="color: #FF1493; font-size: 18px; margin-bottom: 20px;">음악을 불러오는 중입니다... 잠시만 기다려주세요!</div>
        <button class="btn" id="start-btn" style="display: none; background-color: #32CD32; border-color: #32CD32;">게임 시작!</button>
    </div>

    <!-- 게임 화면 -->
    <div id="game-board">
        <div class="top-ui">
            <div>점수: <span id="score-display">0</span></div>
            <div>콤보: <span id="combo-display">0</span></div>
        </div>
        
        <div id="feedback">최고예요!</div>

        <div class="tracks">
            <div class="hit-line"></div>
            
            <div class="track" id="track-0">
                <div class="key-label">D</div>
            </div>
            <div class="track" id="track-1">
                <div class="key-label">F</div>
            </div>
            <div class="track" id="track-2">
                <div class="key-label">J</div>
            </div>
            <div class="track" id="track-3">
                <div class="key-label">K</div>
            </div>
        </div>
    </div>

    <script>
        // --- 게임 설정 값 ---
        const BPM = 57; // 모두가 꽃이야 BPM
        const BEAT_DURATION = 60 / BPM; 
        const MEASURE_DURATION = BEAT_DURATION * 2; 

        const DROP_TIME = 2.0; 
        const HIT_WINDOW = 0.2; 

        const KEYS = ['d', 'f', 'j', 'k']; 
        
        // --- 상태 변수 ---
        let audioContext;
        let audioBuffer;
        let audioSource;
        let startTime;
        
        let tiles = [];
        let score = 0;
        let combo = 0;
        let isPlaying = false;
        let animationFrameId;

        // DOM 요소
        const startBtn = document.getElementById('start-btn');
        const startScreen = document.getElementById('start-screen');
        const gameBoard = document.getElementById('game-board');
        const scoreDisplay = document.getElementById('score-display');
        const comboDisplay = document.getElementById('combo-display');
        const feedbackDisplay = document.getElementById('feedback');
        const loadingMsg = document.getElementById('loading-msg');

        // 1. 자동으로 bgm.mp3 파일 불러오기
        window.addEventListener('load', function() {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            
            fetch('bgm.mp3')
                .then(response => {
                    if (!response.ok) throw new Error("음악 파일이 없습니다.");
                    return response.arrayBuffer();
                })
                .then(arrayBuffer => audioContext.decodeAudioData(arrayBuffer))
                .then(buffer => {
                    audioBuffer = buffer;
                    loadingMsg.style.display = 'none'; 
                    startBtn.style.display = "inline-block"; 
                })
                .catch(error => {
                    console.error("음원 로딩 에러:", error);
                    loadingMsg.innerText = "음원을 불러오는데 실패했습니다.";
                });
        });

        // 2. 게임 시작
        startBtn.addEventListener('click', function() {
            if (!audioBuffer) return;
            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }

            startScreen.style.display = 'none';
            gameBoard.style.display = 'flex';

            startGame();
        });

        // 3. 타일 데이터 생성 및 음악 재생
        function startGame() {
            score = 0;
            combo = 0;
            updateScoreUI();
            
            const songDuration = audioBuffer.duration;
            const totalMeasures = Math.floor(songDuration / MEASURE_DURATION);
            const leadInTime = 1.0; 
            
            for (let i = 1; i < totalMeasures; i++) {
                let targetTime = leadInTime + (i * MEASURE_DURATION);
                let randomTrack = Math.floor(Math.random() * 4); 
                
                let tileEl = document.createElement('div');
                tileEl.className = 'tile';
                document.getElementById(`track-${randomTrack}`).appendChild(tileEl);
                
                tiles.push({
                    track: randomTrack,
                    targetTime: targetTime,
                    element: tileEl,
                    isHit: false
                });
            }

            audioSource = audioContext.createBufferSource();
            audioSource.buffer = audioBuffer;
            audioSource.connect(audioContext.destination);
            
            startTime = audioContext.currentTime;
            audioSource.start(startTime + leadInTime);
            isPlaying = true;

            gameLoop();
        }

        // 4. 게임 루프 (애니메이션 및 타일 위치 계산)
        function gameLoop() {
            if (!isPlaying) return;

            let currentTime = audioContext.currentTime - startTime;
            
            const trackHeight = document.querySelector('.track').offsetHeight;
            const hitLineY = trackHeight - 80 - 40; 

            tiles.forEach((tile, index) => {
                if (tile.isHit) return;

                let timeUntilHit = tile.targetTime - currentTime;

                if (timeUntilHit <= DROP_TIME && timeUntilHit > -HIT_WINDOW) {
                    let progress = 1 - (timeUntilHit / DROP_TIME);
                    let currentY = progress * hitLineY;
                    
                    tile.element.style.top = currentY + 'px';
                } 
                else if (timeUntilHit <= -HIT_WINDOW) {
                    tile.isHit = true; 
                    tile.element.style.display = 'none'; 
                    combo = 0; 
                    showFeedback("아까워요!", "#808080");
                    updateScoreUI();
                }
            });

            if (currentTime > audioBuffer.duration + 2) {
                isPlaying = false;
                alert(`게임 종료! 최종 점수는 ${score}점 입니다.`);
                location.reload(); 
            }

            if (isPlaying) {
                animationFrameId = requestAnimationFrame(gameLoop);
            }
        }

        // 5. 키보드 입력 처리 (판정 로직)
        document.addEventListener('keydown', (e) => {
            if (!isPlaying) return;
            
            let key = e.key.toLowerCase();
            let trackIndex = KEYS.indexOf(key);
            
            if (trackIndex !== -1) {
                let trackEl = document.getElementById(`track-${trackIndex}`);
                trackEl.classList.add('active');
                setTimeout(() => trackEl.classList.remove('active'), 100);

                let currentTime = audioContext.currentTime - startTime;

                let targetTile = tiles.find(t => t.track === trackIndex && !t.isHit && t.targetTime - currentTime < DROP_TIME);

                if (targetTile) {
                    let timeDiff = Math.abs(targetTile.targetTime - currentTime);

                    if (timeDiff <= HIT_WINDOW) {
                        targetTile.isHit = true;
                        targetTile.element.style.display = 'none'; 
                        score += 100;
                        combo += 1;
                        showFeedback("최고예요!", "#FFD700");
                        updateScoreUI();
                    }
                }
            }
        });

        function updateScoreUI() {
            scoreDisplay.innerText = score;
            comboDisplay.innerText = combo;
        }

        function showFeedback(text, color) {
            feedbackDisplay.innerText = text;
            feedbackDisplay.style.color = color;
            feedbackDisplay.style.opacity = '1';
            feedbackDisplay.style.transform = 'scale(1.2)';
            
            setTimeout(() => {
                feedbackDisplay.style.opacity = '0';
                feedbackDisplay.style.transform = 'scale(1)';
            }, 500);
        }
    </script>
</body>
</html>
