<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>산도깨비 장단 맞추기</title>
<style>
    body { 
        text-align: center; 
        font-family: 'Malgun Gothic', sans-serif; 
        background-color: #fdfbf0; 
        user-select: none;
    }
    h1 { color: #333; margin-top: 20px; font-size: 40px; }
    
    .board { 
        display: flex; 
        justify-content: center; 
        gap: 20px; 
        margin: 40px 0; 
        height: 200px; 
    }
    .slot { 
        width: 150px; 
        height: 200px; 
        border: 4px dashed #ccc; 
        border-radius: 20px; 
        display: flex; 
        align-items: center; 
        justify-content: center; 
        background: white; 
        cursor: pointer; 
    }
    
    .pieces { 
        display: flex; 
        justify-content: center; 
        gap: 20px; 
        margin-top: 50px; 
    }
    .piece { 
        width: 150px; 
        height: 200px; 
        border: 5px solid #3b82f6; 
        border-radius: 20px; 
        background: white; 
        display: flex; 
        flex-direction: column; 
        align-items: center; 
        justify-content: center; 
        cursor: pointer; 
        box-shadow: 0 6px 12px rgba(0,0,0,0.15); 
        font-size: 40px; 
        font-weight: bold; 
        color: #1d4ed8; 
    }
    .piece.ddak { 
        border-color: #ef4444; 
        color: #b91c1c; 
    }
    
    /* 쿵 기호 그리기 (동그라미 안 세로선) */
    .circle-line { 
        width: 90px; 
        height: 90px; 
        border: 5px solid #1d4ed8; 
        border-radius: 50%; 
        display: flex; 
        justify-content: center; 
        margin-bottom: 15px; 
    }
    .line { 
        width: 5px; 
        background-color: #1d4ed8; 
        height: 100%; 
    }
    
    /* 딱 기호 그리기 */
    .x-mark { 
        font-size: 100px; 
        line-height: 90px; 
        margin-bottom: 15px; 
    }
    
    #message { 
        font-size: 45px; 
        color: #e11d48; 
        font-weight: bold; 
        margin-top: 30px; 
        display: none; 
    }
    
    .pikachu { 
        width: 120px; 
        margin-top: 10px; 
    }
</style>
</head>
<body>

<h1>산도깨비 소고 장단 맞추기</h1>
<!-- 무료 피카츄 이미지 링크 사용 -->
<img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/25.png" class="pikachu" alt="피카츄">

<div class="board" id="board">
    <div class="slot" onclick="removePiece(0)"></div>
    <div class="slot" onclick="removePiece(1)"></div>
    <div class="slot" onclick="removePiece(2)"></div>
    <div class="slot" onclick="removePiece(3)"></div>
</div>

<div class="pieces" id="pieces">
    <div class="piece" onclick="addPiece('kung')">
        <div class="circle-line"><div class="line"></div></div>
        쿵
    </div>
    <div class="piece" onclick="addPiece('kung')">
        <div class="circle-line"><div class="line"></div></div>
        쿵
    </div>
    <div class="piece" onclick="addPiece('kung')">
        <div class="circle-line"><div class="line"></div></div>
        쿵
    </div>
    <div class="piece ddak" onclick="addPiece('ddak')">
        <div class="x-mark">X</div>
        딱
    </div>
</div>

<div id="message">🎉 참 잘했어요! 장단 완성! 🎉</div>

<script>
    let slots = [null, null, null, null];

    function renderBoard() {
        const boardDivs = document.getElementById('board').children;
        for (let i = 0; i < 4; i++) {
            boardDivs[i].innerHTML = '';
            if (slots[i] === 'kung') {
                boardDivs[i].innerHTML = '<div class="piece"><div class="circle-line"><div class="line"></div></div>쿵</div>';
            } else if (slots[i] === 'ddak') {
                boardDivs[i].innerHTML = '<div class="piece ddak"><div class="x-mark">X</div>딱</div>';
            }
        }
        checkWin();
    }

    function addPiece(type) {
        for (let i = 0; i < 4; i++) {
            if (slots[i] === null) {
                slots[i] = type;
                renderBoard();
                return;
            }
        }
    }

    function removePiece(index) {
        if (slots[index] !== null) {
            slots[index] = null;
            document.getElementById('message').style.display = 'none';
            renderBoard();
        }
    }

    function checkWin() {
        if (slots[0] === 'kung' && slots[1] === 'kung' && slots[2] === 'kung' && slots[3] === 'ddak') {
            document.getElementById('message').style.display = 'block';
        }
    }
</script>

</body>
</html>
