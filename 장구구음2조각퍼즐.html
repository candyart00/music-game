<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>장구 장단 게임</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');
    
    body { 
        text-align: center; 
        font-family: 'Jua', sans-serif; 
        background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
        user-select: none;
        margin: 0;
        padding: 20px;
        min-height: 100vh;
        overflow-x: hidden;
    }
    
    h1 { 
        color: #fff; 
        font-size: 55px; 
        text-shadow: 3px 3px 0 #5b86e5, 6px 6px 0 rgba(0,0,0,0.1);
        margin: 10px 0 10px 0;
    }
    
    .stage-info {
        font-size: 28px;
        color: #1e3a8a;
        margin-bottom: 25px;
        font-weight: bold;
        text-shadow: 2px 2px 0px rgba(255,255,255,0.7);
    }
    
    .level-btns { margin-bottom: 30px; display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; max-width: 900px; margin-left: auto; margin-right: auto;}
    .btn {
        padding: 15px 25px; font-size: 22px; font-family: 'Jua', sans-serif; color: white;
        background: #ff7eb3; border: none; border-radius: 20px; cursor: pointer;
        box-shadow: 0 8px 0 #d6336c, 0 12px 15px rgba(0,0,0,0.2);
        transition: 0.1s;
    }
    .btn:active { transform: translateY(8px); box-shadow: 0 0 0 transparent; }
    .btn-lvl1 { background: #4facfe; box-shadow: 0 8px 0 #008c96; }
    .btn-lvl2 { background: #f6d365; box-shadow: 0 8px 0 #b47a00; color: #5c2b00;}
    .btn-lvl3 { background: #a18cd1; box-shadow: 0 8px 0 #6d4b9a; }
    .btn-lvl4 { background: #ff9a9e; box-shadow: 0 8px 0 #c2454a; }
    .btn-lvl5 { background: #38f9d7; box-shadow: 0 8px 0 #009d7d; color: #004d3e;}
    
    /* 퍼즐 타겟 보드 */
    .target-board-wrapper {
        display: flex; justify-content: center; align-items: center;
        min-height: 220px; overflow-x: auto; padding: 10px;
    }
    
    .target-board {
        height: 180px;
        border: 6px dashed #fff; 
        border-radius: 20px;
        background: rgba(255,255,255,0.5);
        position: relative;
        box-shadow: inset 0 0 25px rgba(255,255,255,0.7);
        transition: width 0.3s ease;
        overflow: hidden; 
    }

    /* 그림자 가이드 레이어 */
    .shadow-layer {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        display: flex;
        opacity: 0.25; 
        filter: grayscale(100%); 
        pointer-events: none;
        z-index: 0;
    }

    /* 실제 맞춰지는 조각 레이어 */
    .active-layer {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        display: flex;
        z-index: 1;
    }
    
    .pieces-container { 
        display: flex; justify-content: center; flex-wrap: wrap; gap: 12px; 
        margin-top: 50px; max-width: 1000px; margin-left: auto; margin-right: auto;
    }
    
    /* 퍼즐 조각 껍데기 */
    .puzzle-piece-btn {
        background: white; border-radius: 15px; overflow: hidden;
        cursor: pointer; box-shadow: 0 8px 0 #cbd5e1;
        transition: 0.1s;
    }
    .puzzle-piece-btn:active {
        transform: translateY(8px); box-shadow: 0 0 0 transparent;
    }

    /* 조각 래퍼 */
    .fragment-wrapper {
        height: 180px; overflow: hidden; position: relative; z-index: 1;
    }
    
    /* 전체 그림 컨테이너 */
    .full-drawing-container {
        height: 180px; position: absolute; top: 0; display: flex;
        pointer-events: none;
    }

    /* 하나의 도형 기호 영역 */
    .symbol-box {
        width: 180px; height: 180px; display: flex; align-items: center; justify-content: center;
        position: relative;
    }
    
    /* 덩: 원 안에 세로줄 */
    .deong-symbol { 
        width: 140px; height: 140px; border: 18px solid #8b5cf6; 
        border-radius: 50%; box-sizing: border-box; 
        display: flex; align-items: center; justify-content: center;
        position: relative;
    }
    .deong-symbol::after {
        content: ''; position: absolute; width: 18px; height: 140px; background: #8b5cf6;
    }
    .deong-symbol span {
        font-size: 55px; font-weight: 900; color: #8b5cf6; 
        background: rgba(255,255,255,0.95); padding: 5px 12px; 
        border-radius: 15px; z-index: 2; box-shadow: 0 4px 10px rgba(0,0,0,0.2); 
    }

    /* 덕: 세로줄 */
    .deok-symbol { 
        width: 150px; height: 150px; position: relative; 
        display: flex; align-items: center; justify-content: center; 
    }
    .deok-symbol::after {
        content: ''; position: absolute; width: 22px; height: 120px; background: #ef4444; border-radius: 10px;
    }
    .deok-symbol span {
        font-size: 55px; font-weight: 900; color: #ef4444; 
        background: rgba(255,255,255,0.95); padding: 5px 12px; 
        border-radius: 15px; z-index: 2; box-shadow: 0 4px 10px rgba(0,0,0,0.2); 
    }

    /* 쿵: 빈 원 */
    .kung-symbol { 
        width: 140px; height: 140px; border: 18px solid #3b82f6; 
        border-radius: 50%; box-sizing: border-box; 
        display: flex; align-items: center; justify-content: center;
        position: relative;
    }
    .kung-symbol span {
        font-size: 55px; font-weight: 900; color: #3b82f6; 
        background: rgba(255,255,255,0.95); padding: 5px 12px; 
        border-radius: 15px; z-index: 2; box-shadow: 0 4px 10px rgba(0,0,0,0.2); 
    }

    /* 쉼표 (-): 가로줄 */
    .rest-symbol { 
        width: 150px; height: 150px; position: relative; 
        display: flex; align-items: center; justify-content: center; 
    }
    .rest-symbol::after {
        content: ''; position: absolute; width: 100px; height: 22px; background: #10b981; border-radius: 10px;
    }
    .rest-symbol span {
        font-size: 55px; font-weight: 900; color: #10b981; 
        background: rgba(255,255,255,0.95); padding: 5px 12px; 
        border-radius: 15px; z-index: 2; box-shadow: 0 4px 10px rgba(0,0,0,0.2); 
    }

    /* 오답 흔들림 */
    @keyframes shake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-10px) rotate(-5deg); background: #fee2e2; }
        50% { transform: translateX(10px) rotate(5deg); background: #fee2e2; }
        75% { transform: translateX(-10px) rotate(-5deg); background: #fee2e2; }
    }
    .shake { animation: shake 0.3s ease-in-out; }
    
    /* 정답/완료 효과 */
    #celebration {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        pointer-events: none; display: none; z-index: 100;
        align-items: center; justify-content: center; flex-direction: column;
        background: rgba(255, 255, 255, 0.4);
    }
    #celebration img {
        width: 350px; transform: scale(0);
        animation: popUp 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        filter: drop-shadow(0 15px 30px rgba(0,0,0,0.4));
    }
    .celebration-text {
        font-size: 60px; color: #ff3366; margin-top: 20px;
        text-shadow: 4px 4px 0 #fff, 0 10px 15px rgba(0,0,0,0.3);
        transform: scale(0);
        animation: popUp 0.8s 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    @keyframes popUp { to { transform: scale(1); } }
    
    .confetti {
        position: absolute; width: 18px; height: 18px; border-radius: 50%;
        animation: explode 1.5s ease-out forwards;
    }
    @keyframes explode {
        0% { opacity: 1; transform: translate(0, 0) scale(1); }
        100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(0.5); }
    }
</style>
</head>
<body>

<h1>장구 장단 게임</h1>
<div class="stage-info" id="stage-info">원하는 단계를 선택 바람!</div>

<div class="level-btns">
    <button class="btn btn-lvl1" onclick="startGame(1)">1단계 (덩/쿵)</button>
    <button class="btn btn-lvl2" onclick="startGame(2)">2단계 (덕/쉼표)</button>
    <button class="btn btn-lvl3" onclick="startGame(3)">3단계 (기본 장단)</button>
    <button class="btn btn-lvl4" onclick="startGame(4)">4단계 (꽃이야 전반)</button>
    <button class="btn btn-lvl5" onclick="startGame(5)">5단계 (꽃이야 완성)</button>
</div>

<div class="target-board-wrapper">
    <div class="target-board" id="board"></div>
</div>
<div class="pieces-container" id="pieces"></div>

<div id="celebration">
    <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/7.png" alt="꼬북이">
    <div class="celebration-text" id="celeb-msg"></div>
</div>

<script>
    let audioCtx;
    let expectedPiece = 0;
    let currentLevel = 1;
    let currentStageIndex = 0;
    
    const levelData = {
        1: [['deong', 'kung'], ['kung', 'deong', 'kung']],
        2: [['deok', 'rest'], ['deok', 'rest', 'deok']],
        3: [['deong', 'deok', 'kung'], ['kung', 'deok', 'rest']],
        4: [['deong', 'rest', 'deok', 'kung']],
        5: [['deong', 'rest', 'deok', 'kung', 'deok', 'rest']] 
    };

    const levelMessages = {
        1: "1단계 성공! 리듬감이 아주 훌륭함!",
        2: "2단계 통과! 장구 소리가 완벽함!",
        3: "3단계 완료! 기본 장단을 완벽하게 익힘!",
        4: "4단계 통과! 꽃이야 장단에 한 걸음 다가감!",
        5: "5단계 클리어! 최고의 장구 마스터로 임명함!"
    };

    // 2조각 분할을 위해 pieceWidth를 90으로 넓힘
    const pieceWidth = 90;   
    const symbolWidth = 180; 

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') audioCtx.resume();
        
        const tempUtterance = new SpeechSynthesisUtterance('');
        tempUtterance.volume = 0;
        window.speechSynthesis.speak(tempUtterance);
    }

    function speakText(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ko-KR';
            utterance.rate = 1.2;
            utterance.pitch = 1.1;
            window.speechSynthesis.speak(utterance);
        }
    }

    function playSound(type) {
        if (!audioCtx) return;
        const now = audioCtx.currentTime;

        if (type === 'deong') { 
            const osc1 = audioCtx.createOscillator();
            const osc2 = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc1.type = 'sine';
            osc2.type = 'square';
            osc1.frequency.setValueAtTime(150, now);
            osc1.frequency.exponentialRampToValueAtTime(30, now + 0.4);
            osc2.frequency.setValueAtTime(400, now);
            osc2.frequency.linearRampToValueAtTime(800, now + 0.15);
            
            osc1.connect(gain);
            osc2.connect(gain);
            gain.connect(audioCtx.destination);
            
            gain.gain.setValueAtTime(1.0, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
            osc1.start(now); osc1.stop(now + 0.4);
            osc2.start(now); osc2.stop(now + 0.15);
        } else if (type === 'deok') { 
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.type = 'square';
            osc.frequency.setValueAtTime(400, now);
            osc.frequency.linearRampToValueAtTime(800, now + 0.15);
            gain.gain.setValueAtTime(0.6, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
            osc.start(now); osc.stop(now + 0.15);
        } else if (type === 'kung') { 
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.type = 'sine';
            osc.frequency.setValueAtTime(180, now);
            osc.frequency.exponentialRampToValueAtTime(30, now + 0.4);
            gain.gain.setValueAtTime(1.2, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
            osc.start(now); osc.stop(now + 0.4);
        } else if (type === 'rest') {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(800, now);
            gain.gain.setValueAtTime(0.1, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
            osc.start(now); osc.stop(now + 0.05);
        } else if (type === 'tick') { 
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(600, now);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
            osc.start(now); osc.stop(now + 0.05);
        } else if (type === 'wrong') { 
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.linearRampToValueAtTime(80, now + 0.2);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
            osc.start(now); osc.stop(now + 0.2);
        }
    }

    function playFanfare() {
        if (!audioCtx) return;
        const notes = [523.25, 659.25, 783.99, 1046.50]; 
        notes.forEach((freq, i) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            const now = audioCtx.currentTime + i * 0.15;
            osc.frequency.setValueAtTime(freq, now);
            gain.gain.setValueAtTime(0, now);
            gain.gain.linearRampToValueAtTime(0.4, now + 0.05);
            gain.gain.linearRampToValueAtTime(0, now + 0.4);
            osc.start(now); osc.stop(now + 0.4);
        });
    }

    function createFireworks() {
        const colors = ['#ff0000', '#00ff00', '#3b82f6', '#ffff00', '#ff00ff', '#00ffff'];
        const container = document.getElementById('celebration');
        
        const oldConfetti = container.querySelectorAll('.confetti');
        oldConfetti.forEach(c => c.remove());

        for (let i = 0; i < 80; i++) {
            const confetti = document.createElement('div');
            confetti.className = 'confetti';
            confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            confetti.style.left = '50%';
            confetti.style.top = '50%';
            
            const angle = Math.random() * Math.PI * 2;
            const distance = Math.random() * 600 + 100;
            const tx = Math.cos(angle) * distance + 'px';
            const ty = Math.sin(angle) * distance + 'px';
            
            confetti.style.setProperty('--tx', tx);
            confetti.style.setProperty('--ty', ty);
            container.appendChild(confetti);
        }
    }

    function startGame(level) {
        initAudio();
        currentLevel = level;
        currentStageIndex = 0;
        document.getElementById('celebration').style.display = 'none';
        loadStage();
    }

    function loadStage() {
        expectedPiece = 0;
        const sequence = levelData[currentLevel][currentStageIndex];
        const totalPieces = sequence.length * 2; 
        
        const info = document.getElementById('stage-info');
        info.innerText = `${currentLevel}단계 - 코스 ${currentStageIndex + 1} / ${levelData[currentLevel].length} 진행 중!`;

        let htmlContent = '';
        sequence.forEach(sym => {
            if (sym === 'deong') {
                htmlContent += '<div class="symbol-box"><div class="deong-symbol"><span>덩</span></div></div>';
            } else if (sym === 'deok') {
                htmlContent += '<div class="symbol-box"><div class="deok-symbol"><span>덕</span></div></div>';
            } else if (sym === 'kung') {
                htmlContent += '<div class="symbol-box"><div class="kung-symbol"><span>쿵</span></div></div>';
            } else if (sym === 'rest') {
                htmlContent += '<div class="symbol-box"><div class="rest-symbol"><span>-</span></div></div>';
            }
        });

        const board = document.getElementById('board');
        board.style.width = (sequence.length * symbolWidth) + 'px';
        board.innerHTML = `
            <div class="shadow-layer">${htmlContent}</div>
            <div class="active-layer" id="active-layer"></div>
        `;

        const piecesDiv = document.getElementById('pieces');
        piecesDiv.innerHTML = '';

        let indices = Array.from({length: totalPieces}, (_, i) => i);
        indices.sort(() => Math.random() - 0.5); 

        indices.forEach(i => {
            const btn = document.createElement('div');
            btn.className = 'puzzle-piece-btn';
            btn.id = 'btn-' + i;
            btn.onclick = () => checkMove(i, btn.id, sequence);

            const wrapper = document.createElement('div');
            wrapper.className = 'fragment-wrapper';
            wrapper.style.width = pieceWidth + 'px';

            const drawing = document.createElement('div');
            drawing.className = 'full-drawing-container';
            drawing.style.width = (sequence.length * symbolWidth) + 'px';
            drawing.style.left = -(i * pieceWidth) + 'px'; 
            drawing.innerHTML = htmlContent;

            wrapper.appendChild(drawing);
            btn.appendChild(wrapper);
            piecesDiv.appendChild(btn);
        });
    }

    function checkMove(clickedIndex, btnId, sequence) {
        const btnElem = document.getElementById(btnId);
        const totalPieces = sequence.length * 2;

        const clickedSymbolIndex = Math.floor(clickedIndex / 2);
        const clickedPart = clickedIndex % 2;
        const clickedType = sequence[clickedSymbolIndex] + '-' + clickedPart;

        const expectedSymbolIndex = Math.floor(expectedPiece / 2);
        const expectedPart = expectedPiece % 2;
        const expectedType = sequence[expectedSymbolIndex] + '-' + expectedPart;

        if (clickedType === expectedType) {
            const drawing = btnElem.querySelector('.full-drawing-container');
            drawing.style.left = -(expectedPiece * pieceWidth) + 'px';

            expectedPiece++;
            
            const activeLayer = document.getElementById('active-layer');
            const wrapper = btnElem.querySelector('.fragment-wrapper');
            activeLayer.appendChild(wrapper);
            btnElem.style.display = 'none';

            if (expectedPiece % 2 === 0) {
                const completedSymbolIndex = (expectedPiece / 2) - 1;
                const completedSymbol = sequence[completedSymbolIndex];
                
                playSound(completedSymbol); 
                
                if (completedSymbol === 'deong') speakText('덩!');
                else if (completedSymbol === 'deok') speakText('덕!');
                else if (completedSymbol === 'kung') speakText('쿵!');
                else if (completedSymbol === 'rest') speakText('쉬고!');
            } else {
                playSound('tick'); 
            }

            if (expectedPiece === totalPieces) {
                if (currentStageIndex + 1 < levelData[currentLevel].length) {
                    currentStageIndex++;
                    document.getElementById('stage-info').innerText = '참 잘했음! 다음 코스 준비 중...';
                    setTimeout(loadStage, 1500);
                } else {
                    document.getElementById('stage-info').innerText = '🎉 단계 클리어함! 🎉';
                    
                    const celebrationMsg = levelMessages[currentLevel];
                    document.getElementById('celeb-msg').innerText = celebrationMsg;
                    
                    setTimeout(() => {
                        playFanfare();
                        speakText(celebrationMsg);
                        document.getElementById('celebration').style.display = 'flex';
                        createFireworks();
                    }, 600);
                }
            }
        } 
        else {
            playSound('wrong');
            btnElem.classList.add('shake');
            setTimeout(() => btnElem.classList.remove('shake'), 300);
        }
    }
</script>

</body>
</html>
