<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>소고 장단 게임</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');
    
    body { 
        text-align: center; 
        font-family: 'Jua', sans-serif; 
        background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
        user-select: none;
        margin: 0;
        padding: 20px;
        min-height: 100vh;
        overflow-x: hidden;
    }
    
    h1 { 
        color: #fff; 
        font-size: 55px; 
        text-shadow: 3px 3px 0 #5b86e5, 6px 6px 0 rgba(0,0,0,0.1);
        margin: 10px 0 10px 0;
    }
    
    .stage-info {
        font-size: 28px;
        color: #1e3a8a;
        margin-bottom: 25px;
        font-weight: bold;
        text-shadow: 2px 2px 0px rgba(255,255,255,0.7);
    }
    
    .level-btns { margin-bottom: 30px; display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; max-width: 900px; margin-left: auto; margin-right: auto;}
    .btn {
        padding: 15px 25px; font-size: 22px; font-family: 'Jua', sans-serif; color: white;
        background: #ff7eb3; border: none; border-radius: 20px; cursor: pointer;
        box-shadow: 0 8px 0 #d6336c, 0 12px 15px rgba(0,0,0,0.2);
        transition: 0.1s;
    }
    .btn:active { transform: translateY(8px); box-shadow: 0 0 0 transparent; }
    .btn-lvl1 { background: #4facfe; box-shadow: 0 8px 0 #008c96; }
    .btn-lvl2 { background: #f6d365; box-shadow: 0 8px 0 #b47a00; color: #5c2b00;}
    .btn-lvl3 { background: #a18cd1; box-shadow: 0 8px 0 #6d4b9a; }
    .btn-lvl4 { background: #ff9a9e; box-shadow: 0 8px 0 #c2454a; }
    .btn-lvl5 { background: #38f9d7; box-shadow: 0 8px 0 #009d7d; color: #004d3e;}
    
    /* 퍼즐 타겟 보드 */
    .target-board-wrapper {
        display: flex; justify-content: center; align-items: center;
        min-height: 220px; overflow-x: auto; padding: 10px;
    }
    
    .target-board {
        height: 180px;
        border: 6px dashed #fff; 
        border-radius: 20px;
        background: rgba(255,255,255,0.5);
        position: relative;
        box-shadow: inset 0 0 25px rgba(255,255,255,0.7);
        transition: width 0.3s ease;
        overflow: hidden; /* 영역 밖 그림자 숨김 */
    }

    /* 그림자 가이드 레이어 */
    .shadow-layer {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        display: flex;
        opacity: 0.25; /* 연한 그림자 처리 */
        filter: grayscale(100%); /* 흑백 실루엣 효과 */
        pointer-events: none;
        z-index: 0;
    }

    /* 실제 맞춰지는 조각 레이어 */
    .active-layer {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        display: flex;
        z-index: 1;
    }
    
    .pieces-container { 
        display: flex; justify-content: center; flex-wrap: wrap; gap: 12px; 
        margin-top: 50px; max-width: 1000px; margin-left: auto; margin-right: auto;
    }
    
    /* 퍼즐 조각 껍데기 */
    .puzzle-piece-btn {
        background: white; border-radius: 15px; overflow: hidden;
        cursor: pointer; box-shadow: 0 8px 0 #cbd5e1;
        transition: 0.1s;
    }
    .puzzle-piece-btn:active {
        transform: translateY(8px); box-shadow: 0 0 0 transparent;
    }

    /* 조각 래퍼 */
    .fragment-wrapper {
        height: 180px; overflow: hidden; position: relative; z-index: 1;
    }
    
    /* 전체 그림 컨테이너 */
    .full-drawing-container {
        height: 180px; position: absolute; top: 0; display: flex;
        pointer-events: none;
    }

    /* 하나의 도형 기호 영역 */
    .symbol-box {
        width: 180px; height: 180px; display: flex; align-items: center; justify-content: center;
        position: relative;
    }
    
    /* 쿵: 동그라미와 텍스트 */
    .k-circle { 
        width: 140px; height: 140px; border: 18px solid #3b82f6; 
        border-radius: 50%; box-sizing: border-box; 
        display: flex; align-items: center; justify-content: center;
        position: relative;
    }
    .k-circle span {
        font-size: 55px; font-weight: 900; color: #3b82f6; 
        background: rgba(255,255,255,0.95); padding: 5px 12px; 
        border-radius: 15px; z-index: 2; box-shadow: 0 4px 10px rgba(0,0,0,0.2); 
    }
    
    /* 딱: X 모양과 텍스트 */
    .d-x { 
        width: 150px; height: 150px; position: relative; 
        display: flex; align-items: center; justify-content: center; 
    }
    .x-line1, .x-line2 { 
        position: absolute; width: 100%; height: 20px; background: #ef4444; border-radius: 10px; 
    }
    .x-line1 { transform: rotate(45deg); }
    .x-line2 { transform: rotate(-45deg); }
    .d-x span { 
        font-size: 55px; font-weight: 900; color: #ef4444; 
        background: rgba(255,255,255,0.95); padding: 5px 12px; 
        border-radius: 15px; z-index: 2; box-shadow: 0 4px 10px rgba(0,0,0,0.2); 
    }

    /* 오답 흔들림 */
    @keyframes shake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-10px) rotate(-5deg); background: #fee2e2; }
        50% { transform: translateX(10px) rotate(5deg); background: #fee2e2; }
        75% { transform: translateX(-10px) rotate(-5deg); background: #fee2e2; }
    }
    .shake { animation: shake 0.3s ease-in-out; }
    
    /* 정답/완료 효과 */
    #celebration {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        pointer-events: none; display: none; z-index: 100;
        align-items: center; justify-content: center; flex-direction: column;
        background: rgba(255, 255, 255, 0.4);
    }
    #celebration img {
        width: 350px; transform: scale(0);
        animation: popUp 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        filter: drop-shadow(0 15px 30px rgba(0,0,0,0.4));
    }
    .celebration-text {
        font-size: 70px; color: #ff3366; margin-top: 20px;
        text-shadow: 4px 4px 0 #fff, 0 10px 15px rgba(0,0,0,0.3);
        transform: scale(0);
        animation: popUp 0.8s 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    @keyframes popUp { to { transform: scale(1); } }
    
    .confetti {
        position: absolute; width: 18px; height: 18px; border-radius: 50%;
        animation: explode 1.5s ease-out forwards;
    }
    @keyframes explode {
        0% { opacity: 1; transform: translate(0, 0) scale(1); }
        100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(0.5); }
    }
</style>
</head>
<body>

<h1>소고 장단 게임</h1>
<div class="stage-info" id="stage-info">게임을 선택하세요!</div>

<div class="level-btns">
    <button class="btn btn-lvl1" onclick="startGame(1)">1단계 (쿵)</button>
    <button class="btn btn-lvl2" onclick="startGame(2)">2단계 (딱)</button>
    <button class="btn btn-lvl3" onclick="startGame(3)">3단계 (기본 장단)</button>
    <button class="btn btn-lvl4" onclick="startGame(4)">4단계 (교차 장단)</button>
    <button class="btn btn-lvl5" onclick="startGame(5)">5단계 (다인 협동)</button>
</div>

<div class="target-board-wrapper">
    <div class="target-board" id="board"></div>
</div>
<div class="pieces-container" id="pieces"></div>

<div id="celebration">
    <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/25.png" alt="피카츄">
    <div class="celebration-text" id="celeb-msg">최고야!</div>
</div>

<script>
    let audioCtx;
    let expectedPiece = 0;
    let currentLevel = 1;
    let currentStageIndex = 0;
    
    const levelData = {
        1: [
            ['kung'],                 
            ['kung', 'kung']          
        ],
        2: [
            ['ddak'],                 
            ['ddak', 'ddak']          
        ],
        3: [
            ['kung', 'ddak'],                 
            ['kung', 'kung', 'ddak'],         
            ['kung', 'kung', 'kung', 'ddak']  
        ],
        4: [
            ['kung', 'ddak', 'kung'],
            ['ddak', 'kung', 'ddak', 'kung']
        ],
        5: [
            ['kung', 'kung', 'ddak', 'ddak'],
            ['kung', 'ddak', 'kung', 'kung', 'ddak']
        ]
    };

    const pieceWidth = 60;   
    const symbolWidth = 180; 
    
    const praiseWords = ["최고야!", "멋져!", "참 잘했어!", "완벽해!"];

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') audioCtx.resume();
        
        const tempUtterance = new SpeechSynthesisUtterance('');
        tempUtterance.volume = 0;
        window.speechSynthesis.speak(tempUtterance);
    }

    function speakText(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ko-KR';
            utterance.rate = 1.2;
            utterance.pitch = 1.1;
            window.speechSynthesis.speak(utterance);
        }
    }

    function playSound(type) {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;

        if (type === 'kung') { 
            osc.type = 'sine';
            osc.frequency.setValueAtTime(180, now);
            osc.frequency.exponentialRampToValueAtTime(30, now + 0.4);
            gain.gain.setValueAtTime(1.2, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
            osc.start(now); osc.stop(now + 0.4);
        } else if (type === 'ddak') { 
            osc.type = 'square';
            osc.frequency.setValueAtTime(400, now);
            osc.frequency.linearRampToValueAtTime(800, now + 0.15);
            gain.gain.setValueAtTime(0.5, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
            osc.start(now); osc.stop(now + 0.15);
        } else if (type === 'tick') { 
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(600, now);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
            osc.start(now); osc.stop(now + 0.05);
        } else if (type === 'wrong') { 
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.linearRampToValueAtTime(80, now + 0.2);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
            osc.start(now); osc.stop(now + 0.2);
        }
    }

    function playFanfare() {
        if (!audioCtx) return;
        const notes = [523.25, 659.25, 783.99, 1046.50]; 
        notes.forEach((freq, i) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            const now = audioCtx.currentTime + i * 0.15;
            osc.frequency.setValueAtTime(freq, now);
            gain.gain.setValueAtTime(0, now);
            gain.gain.linearRampToValueAtTime(0.4, now + 0.05);
            gain.gain.linearRampToValueAtTime(0, now + 0.4);
            osc.start(now); osc.stop(now + 0.4);
        });
    }

    function createFireworks() {
        const colors = ['#ff0000', '#00ff00', '#3b82f6', '#ffff00', '#ff00ff', '#00ffff'];
        const container = document.getElementById('celebration');
        
        const oldConfetti = container.querySelectorAll('.confetti');
        oldConfetti.forEach(c => c.remove());

        for (let i = 0; i < 80; i++) {
            const confetti = document.createElement('div');
            confetti.className = 'confetti';
            confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            confetti.style.left = '50%';
            confetti.style.top = '50%';
            
            const angle = Math.random() * Math.PI * 2;
            const distance = Math.random() * 600 + 100;
            const tx = Math.cos(angle) * distance + 'px';
            const ty = Math.sin(angle) * distance + 'px';
            
            confetti.style.setProperty('--tx', tx);
            confetti.style.setProperty('--ty', ty);
            container.appendChild(confetti);
        }
    }

    function startGame(level) {
        initAudio();
        currentLevel = level;
        currentStageIndex = 0;
        document.getElementById('celebration').style.display = 'none';
        loadStage();
    }

    function loadStage() {
        expectedPiece = 0;
        const sequence = levelData[currentLevel][currentStageIndex];
        const totalPieces = sequence.length * 3;
        
        const info = document.getElementById('stage-info');
        info.innerText = `${currentLevel}단계 - 코스 ${currentStageIndex + 1} / ${levelData[currentLevel].length} 진행중!`;

        let htmlContent = '';
        sequence.forEach(sym => {
            if (sym === 'kung') {
                htmlContent += '<div class="symbol-box"><div class="k-circle"><span>쿵</span></div></div>';
            } else {
                htmlContent += '<div class="symbol-box"><div class="d-x"><div class="x-line1"></div><div class="x-line2"></div><span>딱</span></div></div>';
            }
        });

        // 보드판 세팅 및 그림자 레이어 추가
        const board = document.getElementById('board');
        board.style.width = (sequence.length * symbolWidth) + 'px';
        board.innerHTML = `
            <div class="shadow-layer">${htmlContent}</div>
            <div class="active-layer" id="active-layer"></div>
        `;

        const piecesDiv = document.getElementById('pieces');
        piecesDiv.innerHTML = '';

        let indices = Array.from({length: totalPieces}, (_, i) => i);
        indices.sort(() => Math.random() - 0.5); 

        indices.forEach(i => {
            const btn = document.createElement('div');
            btn.className = 'puzzle-piece-btn';
            btn.id = 'btn-' + i;
            btn.onclick = () => checkMove(i, btn.id, sequence);

            const wrapper = document.createElement('div');
            wrapper.className = 'fragment-wrapper';
            wrapper.style.width = pieceWidth + 'px';

            const drawing = document.createElement('div');
            drawing.className = 'full-drawing-container';
            drawing.style.width = (sequence.length * symbolWidth) + 'px';
            drawing.style.left = -(i * pieceWidth) + 'px'; 
            drawing.innerHTML = htmlContent;

            wrapper.appendChild(drawing);
            btn.appendChild(wrapper);
            piecesDiv.appendChild(btn);
        });
    }

    function checkMove(clickedIndex, btnId, sequence) {
        const btnElem = document.getElementById(btnId);
        const totalPieces = sequence.length * 3;

        if (clickedIndex === expectedPiece) {
            expectedPiece++;
            
            // 조각을 active-layer로 이동 (그림자 위를 덮게 됨)
            const activeLayer = document.getElementById('active-layer');
            const wrapper = btnElem.querySelector('.fragment-wrapper');
            activeLayer.appendChild(wrapper);
            btnElem.style.display = 'none';

            if (expectedPiece % 3 === 0) {
                const completedSymbolIndex = (expectedPiece / 3) - 1;
                const completedSymbol = sequence[completedSymbolIndex];
                
                playSound(completedSymbol); 
                speakText(completedSymbol === 'kung' ? '쿵!' : '딱!'); 
            } else {
                playSound('tick'); 
            }

            if (expectedPiece === totalPieces) {
                if (currentStageIndex + 1 < levelData[currentLevel].length) {
                    currentStageIndex++;
                    document.getElementById('stage-info').innerText = '참 잘했음! 다음 코스 준비 중...';
                    setTimeout(loadStage, 1500);
                } else {
                    document.getElementById('stage-info').innerText = '🎉 단계 클리어! 🎉';
                    
                    const randomWord = praiseWords[Math.floor(Math.random() * praiseWords.length)];
                    document.getElementById('celeb-msg').innerText = randomWord;
                    
                    setTimeout(() => {
                        playFanfare();
                        speakText(randomWord);
                        document.getElementById('celebration').style.display = 'flex';
                        createFireworks();
                    }, 600);
                }
            }
        } 
        else {
            playSound('wrong');
            btnElem.classList.add('shake');
            setTimeout(() => btnElem.classList.remove('shake'), 300);
        }
    }
</script>

</body>
</html>
